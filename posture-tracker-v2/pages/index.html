<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 体态评估助手</title>
    <style id="theme-vars">
/* ============================================================
   Posture Tracker V2 — Brand Design Tokens
   Primary: Rose (#e11d48 family) — Pilates professional tone
   Neutrals: Warm stone grays
   ============================================================ */

:root {
  /* --- Brand Primary Scale (Rose) --- */
  --color-primary-50: #fff1f2;
  --color-primary-100: #ffe4e6;
  --color-primary-200: #fecdd3;
  --color-primary-300: #fda4af;
  --color-primary-400: #fb7185;
  --color-primary-500: #f43f5e;
  --color-primary-600: #e11d48;
  --color-primary-700: #be123c;
  --color-primary-800: #9f1239;
  --color-primary-900: #881337;

  /* --- Neutrals (Warm Stone) --- */
  --color-stone-50: #fafaf9;
  --color-stone-100: #f5f5f4;
  --color-stone-200: #e7e5e4;
  --color-stone-300: #d6d3d1;
  --color-stone-400: #a8a29e;
  --color-stone-500: #78716c;
  --color-stone-600: #57534e;
  --color-stone-700: #44403c;
  --color-stone-800: #292524;
  --color-stone-900: #1c1917;

  /* --- State Colors --- */
  --state-success: #16a34a;
  --state-success-bg: #dcfce7;
  --state-warning: #d97706;
  --state-warning-bg: #fef3c7;
  --state-error: #dc2626;
  --state-error-bg: #fee2e2;
  --state-info: #2563eb;
  --state-info-bg: #dbeafe;

  /* --- Semantic Aliases (required by apply-html-head-contract) --- */
  --color-background: #fafaf9;
  --color-foreground: #1c1917;
  --color-card: #ffffff;
  --color-card-foreground: #1c1917;
  --color-popover: #ffffff;
  --color-popover-foreground: #1c1917;
  --color-primary: #e11d48;
  --color-primary-foreground: #ffffff;
  --color-muted: #f5f5f4;
  --color-muted-foreground: #78716c;
  --color-border: #e7e5e4;
  --color-input: #e7e5e4;
  --color-ring: #e11d48;
  --color-radius-small: 4px;
  --color-radius-medium: 8px;
  --color-radius-large: 12px;

  /* --- Radius Scale --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* --- Shadows --- */
  --shadow-sm: 0 1px 2px 0 rgba(28, 25, 23, 0.03);
  --shadow: 0 1px 3px 0 rgba(28, 25, 23, 0.04), 0 1px 2px -1px rgba(28, 25, 23, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(28, 25, 23, 0.04), 0 2px 4px -2px rgba(28, 25, 23, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(28, 25, 23, 0.05), 0 4px 6px -4px rgba(28, 25, 23, 0.05);
  --shadow-float: 0 20px 25px -5px rgba(28, 25, 23, 0.1), 0 8px 10px -6px rgba(28, 25, 23, 0.08);

  /* --- Spacing --- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;
  --spacing-3xl: 64px;

  /* --- Typography --- */
  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Noto Serif SC', 'Georgia', serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;

  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  --leading-tight: 1.25;
  --leading-snug: 1.375;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 350ms ease;
}

.dark {
  --color-background: #1c1917;
  --color-foreground: #fafaf9;
  --color-card: #292524;
  --color-card-foreground: #fafaf9;
  --color-popover: #292524;
  --color-popover-foreground: #fafaf9;
  --color-primary: #fb7185;
  --color-primary-foreground: #1c1917;
  --color-muted: #44403c;
  --color-muted-foreground: #a8a29e;
  --color-border: #44403c;
  --color-input: #44403c;
  --color-ring: #fb7185;
}

.font-sans { font-family: var(--font-sans); }
.font-serif { font-family: var(--font-serif); }
.font-mono { font-family: var(--font-mono); }

.text-xs { font-size: var(--text-xs); line-height: var(--leading-normal); }
.text-sm { font-size: var(--text-sm); line-height: var(--leading-normal); }
.text-base { font-size: var(--text-base); line-height: var(--leading-normal); }
.text-lg { font-size: var(--text-lg); line-height: var(--leading-snug); }
.text-xl { font-size: var(--text-xl); line-height: var(--leading-snug); }
.text-2xl { font-size: var(--text-2xl); line-height: var(--leading-tight); }
.text-3xl { font-size: var(--text-3xl); line-height: var(--leading-tight); }
.text-4xl { font-size: var(--text-4xl); line-height: var(--leading-tight); }

.font-normal { font-weight: var(--font-normal); }
.font-medium { font-weight: var(--font-medium); }
.font-semibold { font-weight: var(--font-semibold); }
.font-bold { font-weight: var(--font-bold); }

.leading-tight { line-height: var(--leading-tight); }
.leading-snug { line-height: var(--leading-snug); }
.leading-normal { line-height: var(--leading-normal); }
.leading-relaxed { line-height: var(--leading-relaxed); }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--color-background);
    --color-foreground: var(--color-foreground);
    --color-card: var(--color-card);
    --color-card-foreground: var(--color-card-foreground);
    --color-popover: var(--color-popover);
    --color-popover-foreground: var(--color-popover-foreground);
    --color-primary: var(--color-primary);
    --color-primary-foreground: var(--color-primary-foreground);
    --color-muted: var(--color-muted);
    --color-muted-foreground: var(--color-muted-foreground);
    --color-border: var(--color-border);
    --color-input: var(--color-input);
    --color-ring: var(--color-ring);
    --radius-sm: var(--color-radius-small);
    --radius-md: var(--color-radius-medium);
    --radius-lg: var(--color-radius-large);
  }
  @layer base {
    body { background: var(--color-background); color: var(--color-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style id="semantic-token-fallback">
      .bg-background { background-color: var(--color-background); }
      .text-background { color: var(--color-background); }
      .border-background { border-color: var(--color-background); }
      .ring-background { --tw-ring-color: var(--color-background); }
      .bg-foreground { background-color: var(--color-foreground); }
      .text-foreground { color: var(--color-foreground); }
      .border-foreground { border-color: var(--color-foreground); }
      .ring-foreground { --tw-ring-color: var(--color-foreground); }
      .bg-card { background-color: var(--color-card); }
      .text-card { color: var(--color-card); }
      .border-card { border-color: var(--color-card); }
      .ring-card { --tw-ring-color: var(--color-card); }
      .bg-card-foreground { background-color: var(--color-card-foreground); }
      .text-card-foreground { color: var(--color-card-foreground); }
      .border-card-foreground { border-color: var(--color-card-foreground); }
      .ring-card-foreground { --tw-ring-color: var(--color-card-foreground); }
      .bg-popover { background-color: var(--color-popover); }
      .text-popover { color: var(--color-popover); }
      .border-popover { border-color: var(--color-popover); }
      .ring-popover { --tw-ring-color: var(--color-popover); }
      .bg-popover-foreground { background-color: var(--color-popover-foreground); }
      .text-popover-foreground { color: var(--color-popover-foreground); }
      .border-popover-foreground { border-color: var(--color-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--color-popover-foreground); }
      .bg-primary { background-color: var(--color-primary); }
      .text-primary { color: var(--color-primary); }
      .border-primary { border-color: var(--color-primary); }
      .ring-primary { --tw-ring-color: var(--color-primary); }
      .bg-primary-foreground { background-color: var(--color-primary-foreground); }
      .text-primary-foreground { color: var(--color-primary-foreground); }
      .border-primary-foreground { border-color: var(--color-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--color-primary-foreground); }
      .bg-muted { background-color: var(--color-muted); }
      .text-muted { color: var(--color-muted); }
      .border-muted { border-color: var(--color-muted); }
      .ring-muted { --tw-ring-color: var(--color-muted); }
      .bg-muted-foreground { background-color: var(--color-muted-foreground); }
      .text-muted-foreground { color: var(--color-muted-foreground); }
      .border-muted-foreground { border-color: var(--color-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--color-muted-foreground); }
      .bg-border { background-color: var(--color-border); }
      .text-border { color: var(--color-border); }
      .border-border { border-color: var(--color-border); }
      .ring-border { --tw-ring-color: var(--color-border); }
      .bg-input { background-color: var(--color-input); }
      .text-input { color: var(--color-input); }
      .border-input { border-color: var(--color-input); }
      .ring-input { --tw-ring-color: var(--color-input); }
      .bg-ring { background-color: var(--color-ring); }
      .text-ring { color: var(--color-ring); }
      .border-ring { border-color: var(--color-ring); }
      .ring-ring { --tw-ring-color: var(--color-ring); }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;

</head>
<body>
    <main class="dashboard" style="padding-bottom: 72px;">

        <!-- ===== Welcome Card ===== -->
        <section class="welcome-card" style="
            background: linear-gradient(135deg, var(--color-primary-600), var(--color-primary-700));
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg) var(--spacing-md);
            margin: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            color: #ffffff;
        ">
            <div style="
                width: 48px;
                height: 48px;
                border-radius: var(--radius-full);
                background: rgba(255,255,255,0.25);
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
            ">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
            <div>
                <p style="font-size: var(--text-lg); font-weight: var(--font-semibold); margin: 0 0 2px 0;">你好，陈教练</p>
                <p style="font-size: var(--text-sm); opacity: 0.85; margin: 0;">工作室管理员</p>
            </div>
        </section>

        <!-- ===== Stats Grid ===== -->
        <section class="stats-grid" style="
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-sm);
            padding: 0 var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        ">
            <div class="stat-card" style="
                background: var(--color-card);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                padding: var(--spacing-md) var(--spacing-sm);
                text-align: center;
            ">
                <p style="font-size: var(--text-2xl); font-weight: var(--font-bold); color: var(--color-primary); margin: 0 0 4px 0;">24</p>
                <p style="font-size: var(--text-xs); color: var(--color-stone-500); margin: 0;">学员总数</p>
            </div>
            <div class="stat-card" style="
                background: var(--color-card);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                padding: var(--spacing-md) var(--spacing-sm);
                text-align: center;
            ">
                <p style="font-size: var(--text-2xl); font-weight: var(--font-bold); color: var(--color-primary); margin: 0 0 4px 0;">58</p>
                <p style="font-size: var(--text-xs); color: var(--color-stone-500); margin: 0;">评估次数</p>
            </div>
            <div class="stat-card" style="
                background: var(--color-card);
                border: 1px solid var(--color-border);
                border-radius: var(--radius-md);
                padding: var(--spacing-md) var(--spacing-sm);
                text-align: center;
            ">
                <p style="font-size: var(--text-2xl); font-weight: var(--font-bold); color: var(--color-primary); margin: 0 0 4px 0;">52</p>
                <p style="font-size: var(--text-xs); color: var(--color-stone-500); margin: 0;">已完成</p>
            </div>
        </section>

        <!-- ===== Quick Actions ===== -->
        <section style="padding: 0 var(--spacing-md); margin-bottom: var(--spacing-lg);">
            <h2 style="
                font-size: var(--text-base);
                font-weight: var(--font-semibold);
                color: var(--color-stone-900);
                margin: 0 0 var(--spacing-md) 0;
            ">快捷操作</h2>

            <div style="display: flex; flex-direction: column; gap: var(--spacing-sm);">
                <!-- New Assessment -->
                <a class="quick-action-card" data-dom-id="go-assessment" href="#" style="
                    display: flex;
                    align-items: center;
                    gap: var(--spacing-md);
                    background: var(--color-card);
                    border: 1px solid var(--color-border);
                    border-radius: var(--radius-md);
                    padding: var(--spacing-md);
                    text-decoration: none;
                    color: inherit;
                    transition: border-color var(--transition-fast);
                " onmouseover="this.style.borderColor='var(--color-primary-400)'" onmouseout="this.style.borderColor='var(--color-border)'">
                    <div style="
                        width: 40px;
                        height: 40px;
                        border-radius: var(--radius-full);
                        background: var(--color-primary-50);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        flex-shrink: 0;
                    ">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary-600)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
                            <circle cx="12" cy="13" r="3"/>
                        </svg>
                    </div>
                    <div>
                        <p style="font-size: var(--text-sm); font-weight: var(--font-medium); color: var(--color-stone-900); margin: 0 0 2px 0;">新建体态评估</p>
                        <p style="font-size: var(--text-xs); color: var(--color-stone-400); margin: 0;">上传照片进行AI体态分析</p>
                    </div>
                    <svg style="margin-left: auto; flex-shrink: 0;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-stone-300)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </a>

                <!-- Member Management -->
                <a class="quick-action-card" href="#" style="
                    display: flex;
                    align-items: center;
                    gap: var(--spacing-md);
                    background: var(--color-card);
                    border: 1px solid var(--color-border);
                    border-radius: var(--radius-md);
                    padding: var(--spacing-md);
                    text-decoration: none;
                    color: inherit;
                    transition: border-color var(--transition-fast);
                " onmouseover="this.style.borderColor='var(--color-primary-400)'" onmouseout="this.style.borderColor='var(--color-border)'">
                    <div style="
                        width: 40px;
                        height: 40px;
                        border-radius: var(--radius-full);
                        background: var(--color-primary-50);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        flex-shrink: 0;
                    ">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary-600)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                    </div>
                    <div>
                        <p style="font-size: var(--text-sm); font-weight: var(--font-medium); color: var(--color-stone-900); margin: 0 0 2px 0;">学员管理</p>
                        <p style="font-size: var(--text-xs); color: var(--color-stone-400); margin: 0;">查看和管理所有学员</p>
                    </div>
                    <svg style="margin-left: auto; flex-shrink: 0;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-stone-300)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </a>
            </div>
        </section>

        <!-- ===== Recent Assessments ===== -->
        <section style="padding: 0 var(--spacing-md); margin-bottom: var(--spacing-xl);">
            <h2 style="
                font-size: var(--text-base);
                font-weight: var(--font-semibold);
                color: var(--color-stone-900);
                margin: 0 0 var(--spacing-md) 0;
            ">最近评估</h2>

            <div style="display: flex; flex-direction: column; gap: var(--spacing-sm);">

                <!-- Item 1 -->
                <div class="assessment-item" style="
                    display: flex;
                    align-items: center;
                    gap: var(--spacing-md);
                    background: var(--color-card);
                    border: 1px solid var(--color-border);
                    border-radius: var(--radius-md);
                    padding: var(--spacing-md);
                ">
                    <div style="
                        width: 36px;
                        height: 36px;
                        border-radius: var(--radius-full);
                        background: var(--color-stone-100);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        flex-shrink: 0;
                    ">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-stone-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <div style="flex: 1; min-width: 0;">
                        <p style="font-size: var(--text-sm); font-weight: var(--font-medium); color: var(--color-stone-900); margin: 0 0 2px 0;">王小明</p>
                        <p style="font-size: var(--text-xs); color: var(--color-stone-400); margin: 0;">初始评估</p>
                    </div>
                    <span style="
                        display: inline-flex;
                        align-items: center;
                        font-size: var(--text-xs);
                        font-weight: var(--font-medium);
                        color: var(--state-success);
                        background: var(--state-success-bg);
                        border-radius: var(--radius-full);
                        padding: 2px 10px;
                        white-space: nowrap;
                    ">已完成</span>
                </div>

                <!-- Item 2 -->
                <div class="assessment-item" style="
                    display: flex;
                    align-items: center;
                    gap: var(--spacing-md);
                    background: var(--color-card);
                    border: 1px solid var(--color-border);
                    border-radius: var(--radius-md);
                    padding: var(--spacing-md);
                ">
                    <div style="
                        width: 36px;
                        height: 36px;
                        border-radius: var(--radius-full);
                        background: var(--color-stone-100);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        flex-shrink: 0;
                    ">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-stone-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <div style="flex: 1; min-width: 0;">
                        <p style="font-size: var(--text-sm); font-weight: var(--font-medium); color: var(--color-stone-900); margin: 0 0 2px 0;">李婷婷</p>
                        <p style="font-size: var(--text-xs); color: var(--color-stone-400); margin: 0;">复评</p>
                    </div>
                    <span style="
                        display: inline-flex;
                        align-items: center;
                        font-size: var(--text-xs);
                        font-weight: var(--font-medium);
                        color: var(--state-warning);
                        background: var(--state-warning-bg);
                        border-radius: var(--radius-full);
                        padding: 2px 10px;
                        white-space: nowrap;
                    ">评估中</span>
                </div>

                <!-- Item 3 -->
                <div class="assessment-item" style="
                    display: flex;
                    align-items: center;
                    gap: var(--spacing-md);
                    background: var(--color-card);
                    border: 1px solid var(--color-border);
                    border-radius: var(--radius-md);
                    padding: var(--spacing-md);
                ">
                    <div style="
                        width: 36px;
