:root {

  --color-primary-50: #fff1f2;

  --color-stone-100: #f5f5f4;
  --color-stone-200: #e7e5e4;
  --color-stone-300: #d6d3d1;
  --color-stone-400: #a8a29e;
  --color-stone-500: #78716c;
  --color-stone-600: #57534e;
  --color-stone-700: #44403c;
  --color-stone-800: #292524;
  --color-stone-900: #1c1917;

  /* --- State Colors --- */
  --state-success: #16a34a;
  --state-success-bg: #dcfce7;
  --state-warning: #d97706;
  --state-warning-bg: #fef3c7;
  --state-error: #dc2626;
  --state-error-bg: #fee2e2;
  --state-info: #2563eb;

  /* --- Semantic Aliases (required by apply-html-head-contract) --- */
  --color-background: #fafaf9;
  --color-foreground: #1c1917;
  --color-card: #ffffff;
  --color-card-foreground: #1c1917;

  --color-input: #e7e5e4;
  --color-ring: #e11d48;
  --color-radius-small: 4px;
  --color-radius-medium: 8px;
  --color-radius-large: 12px;

  /* --- Radius Scale --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* --- Shadows --- */
  --shadow-sm: 0 1px 2px 0 rgba(28, 25, 23, 0.03);
  --shadow: 0 1px 3px 0 rgba(28, 25, 23, 0.04), 0 1px 2px -1px rgba(28, 25, 23, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(28, 25, 23, 0.04), 0 2px 4px -2px rgba(28, 25, 23, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(28, 25, 23, 0.05), 0 4px 6px -4px rgba(28, 25, 23, 0.05);
  --shadow-float: 0 20px 25px -5px rgba(28, 25, 23, 0.1), 0 8px 10px -6px rgba(28, 25, 23, 0.08);

  /* --- Spacing --- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;
  --spacing-3xl: 64px;

  /* --- Typography --- */
  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Noto Serif SC', 'Georgia', serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;

  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  --leading-tight: 1.25;
  --leading-snug: 1.375;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 350ms ease;
}

.dark {
  --color-background: #1c1917;
  --color-foreground: #fafaf9;
  --color-card: #292524;
  --color-card-foreground: #fafaf9;
  --color-popover: #292524;
  --color-popover-foreground: #fafaf9;

  --color-input: #44403c;
  --color-ring: #fb7185;
}

.text-sm { font-size: var(--text-sm); line-height: var(--leading-normal); }
.text-base { font-size: var(--text-base); line-height: var(--leading-normal); }
.text-lg { font-size: var(--text-lg); line-height: var(--leading-snug); }
.text-xl { font-size: var(--text-xl); line-height: var(--leading-snug); }
.text-2xl { font-size: var(--text-2xl); line-height: var(--leading-tight); }
.text-3xl { font-size: var(--text-3xl); line-height: var(--leading-tight); }
.text-4xl { font-size: var(--text-4xl); line-height: var(--leading-tight); }

.font-normal { font-weight: var(--font-normal); }

.leading-snug { line-height: var(--leading-snug); }
.leading-normal { line-height: var(--leading-normal); }
.leading-relaxed { line-height: var(--leading-relaxed); }

      /* ====== Page-Specific Styles ====== */
      body {
        font-family: var(--font-sans);
        margin: 0;
        padding: 0;
        background: var(--color-background);
        color: var(--color-foreground);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .page-container {
        max-width: 375px;
        margin: 0 auto;
        min-height: 100vh;
        position: relative;
        background: var(--color-background);
        padding-bottom: 72px;
      }

      /* Page Header */
      .page-header {
        padding: 20px 20px 0;
      }
      .page-header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        line-height: var(--leading-tight);
        color: var(--color-foreground);
        margin: 0;
      }

      /* Search Bar */
      .search-bar-wrapper {
        padding: 12px 20px;
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--color-background);
      }
      .search-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--color-card);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-full);
        padding: 10px 16px;
        transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      }
      .search-bar:focus-within {
        border-color: var(--color-ring);
        box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.1);
      }
      .search-bar svg {
        width: 18px;
        height: 18px;
        color: var(--color-stone-400);
        flex-shrink: 0;
      }
      .search-bar input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-size: var(--text-sm);
        color: var(--color-foreground);
        font-family: var(--font-sans);
      }
      .search-bar input::placeholder {
        color: var(--color-stone-400);
      }

      /* Member List */
      .member-list {
        padding: 0 20px;
      }
      .member-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: var(--color-card);
        border-radius: var(--radius-lg);
        margin-bottom: 10px;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--color-stone-100);
        cursor: pointer;
        transition: transform var(--transition-fast), box-shadow var(--transition-fast);
      }
      .member-card:active {
        transform: scale(0.985);
        box-shadow: var(--shadow);
      }

      /* Avatar */
      .avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: var(--text-lg);
        font-weight: 600;
        color: #fff;
        flex-shrink: 0;
        background: linear-gradient(135deg, var(--color-primary-400), var(--color-primary-600));
      }

      /* Member Info */
      .member-info {
        flex: 1;
        min-width: 0;
      }
      .member-name {
        font-size: var(--text-base);
        font-weight: 600;
        color: var(--color-foreground);
        line-height: var(--leading-snug);
        margin-bottom: 2px;
      }
      .member-phone {
        font-size: var(--text-sm);
        color: var(--color-muted-foreground);
        line-height: var(--leading-normal);
      }

      /* Assessment Count */
      .assessment-count {
        text-align: right;
        flex-shrink: 0;
      }
      .assessment-count .count-num {
        font-size: var(--text-xl);
        font-weight: 700;
        color: var(--color-primary);
        line-height: var(--leading-tight);
      }
      .assessment-count .count-label {
        font-size: var(--text-xs);
        color: var(--color-muted-foreground);
        line-height: var(--leading-normal);
      }

      /* Empty State */
      .empty-state {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 80px 20px;
      }
      .empty-state.visible {
        display: flex;
      }
      .empty-state svg {
        width: 64px;
        height: 64px;
        color: var(--color-stone-300);
        margin-bottom: 16px;
      }
      .empty-state p {
        font-size: var(--text-sm);
        color: var(--color-stone-400);
        margin: 0;
      }

      /* Bottom Tab Bar */
      .tab-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100%;
        height: 64px;
        background: var(--color-card);
        border-top: 1px solid var(--color-stone-100);
        display: flex;
        align-items: center;
        justify-content: space-around;
        z-index: 100;
        padding-bottom: env(safe-area-inset-bottom, 0);
        box-shadow: 0 -1px 4px rgba(0, 0, 0, 0.04);
      }
      .tab-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        text-decoration: none;
        cursor: pointer;
        padding: 6px 16px;
        -webkit-tap-highlight-color: transparent;
      }
      .tab-item svg {
        width: 22px;
        height: 22px;
        color: var(--color-stone-400);
        transition: color var(--transition-fast);
      }
      .tab-item span {
        font-size: 10px;
        color: var(--color-stone-400);
        font-weight: 500;
        transition: color var(--transition-fast);
      }
      .tab-item.active svg {
        color: var(--color-primary);
      }
      .tab-item.active span {
        color: var(--color-primary);
        font-weight: 600;
      }
    </style>
