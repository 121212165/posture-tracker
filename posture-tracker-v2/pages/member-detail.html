    <style id="theme-vars">
/* ============================================================
   Posture Tracker V2 — Brand Design Tokens
   Primary: Rose (#e11d48 family) — Pilates professional tone
   Neutrals: Warm stone grays
   ============================================================ */

:root {
  /* --- Brand Primary Scale (Rose) --- */
  --color-primary-50: #fff1f2;
  --color-primary-100: #ffe4e6;
  --color-primary-200: #fecdd3;
  --color-primary-300: #fda4af;
  --color-primary-400: #fb7185;
  --color-primary-500: #f43f5e;
  --color-primary-600: #e11d48;
  --color-primary-700: #be123c;
  --color-primary-800: #9f1239;
  --color-primary-900: #881337;

  /* --- Neutrals (Warm Stone) --- */
  --color-stone-50: #fafaf9;
  --color-stone-100: #f5f5f4;
  --color-stone-200: #e7e5e4;
  --color-stone-300: #d6d3d1;
  --color-stone-400: #a8a29e;
  --color-stone-500: #78716c;
  --color-stone-600: #57534e;
  --color-stone-700: #44403c;
  --color-stone-800: #292524;
  --color-stone-900: #1c1917;

  /* --- State Colors --- */
  --state-success: #16a34a;
  --state-success-bg: #dcfce7;
  --state-warning: #d97706;
  --state-warning-bg: #fef3c7;
  --state-error: #dc2626;
  --state-error-bg: #fee2e2;
  --state-info: #2563eb;
  --state-info-bg: #dbeafe;

  /* --- Semantic Aliases (required by apply-html-head-contract) --- */
  --color-background: #fafaf9;
  --color-foreground: #1c1917;
  --color-card: #ffffff;
  --color-card-foreground: #1c1917;
  --color-popover: #ffffff;
  --color-popover-foreground: #1c1917;
  --color-primary: #e11d48;
  --color-primary-foreground: #ffffff;
  --color-muted: #f5f5f4;
  --color-muted-foreground: #78716c;
  --color-border: #e7e5e4;
  --color-input: #e7e5e4;
  --color-ring: #e11d48;
  --color-radius-small: 4px;
  --color-radius-medium: 8px;
  --color-radius-large: 12px;

  /* --- Radius Scale --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* --- Shadows --- */
  --shadow-sm: 0 1px 2px 0 rgba(28, 25, 23, 0.03);
  --shadow: 0 1px 3px 0 rgba(28, 25, 23, 0.04), 0 1px 2px -1px rgba(28, 25, 23, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(28, 25, 23, 0.04), 0 2px 4px -2px rgba(28, 25, 23, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(28, 25, 23, 0.05), 0 4px 6px -4px rgba(28, 25, 23, 0.05);
  --shadow-float: 0 20px 25px -5px rgba(28, 25, 23, 0.1), 0 8px 10px -6px rgba(28, 25, 23, 0.08);

  /* --- Spacing --- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;
  --spacing-3xl: 64px;

  /* --- Typography --- */
  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Noto Serif SC', 'Georgia', serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;

  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  --leading-tight: 1.25;
  --leading-snug: 1.375;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 350ms ease;
}

.dark {
  --color-background: #1c1917;
  --color-foreground: #fafaf9;
  --color-card: #292524;
  --color-card-foreground: #fafaf9;
  --color-popover: #292524;
  --color-popover-foreground: #fafaf9;
  --color-primary: #fb7185;
  --color-primary-foreground: #1c1917;
  --color-muted: #44403c;
  --color-muted-foreground: #a8a29e;
  --color-border: #44403c;
  --color-input: #44403c;
  --color-ring: #fb7185;
}

.font-sans { font-family: var(--font-sans); }
.font-serif { font-family: var(--font-serif); }
.font-mono { font-family: var(--font-mono); }

.text-xs { font-size: var(--text-xs); line-height: var(--leading-normal); }
.text-sm { font-size: var(--text-sm); line-height: var(--leading-normal); }
.text-base { font-size: var(--text-base); line-height: var(--leading-normal); }
.text-lg { font-size: var(--text-lg); line-height: var(--leading-snug); }
.text-xl { font-size: var(--text-xl); line-height: var(--leading-snug); }
.text-2xl { font-size: var(--text-2xl); line-height: var(--leading-tight); }
.text-3xl { font-size: var(--text-3xl); line-height: var(--leading-tight); }
.text-4xl { font-size: var(--text-4xl); line-height: var(--leading-tight); }

.font-normal { font-weight: var(--font-normal); }
.font-medium { font-weight: var(--font-medium); }
.font-semibold { font-weight: var(--font-semibold); }

.leading-tight { line-height: var(--leading-tight); }
.leading-snug { line-height: var(--leading-snug); }
.leading-normal { line-height: var(--leading-normal); }
.leading-relaxed { line-height: var(--leading-relaxed); }

    </style>

    <style>
    /* --- Reset & Base --- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: var(--font-sans);
      background-color: var(--color-background);
      color: var(--color-foreground);
      line-height: var(--leading-normal);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* --- Layout --- */
    .page { max-width: 375px; margin: 0 auto; min-height: 100vh; background-color: var(--color-background); }

    /* --- Top Nav --- */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      height: 56px;
      padding: 0 var(--spacing-md);
      background-color: var(--color-card);
      border-bottom: 1px solid var(--color-border);
    }
    .top-nav .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--color-foreground);
      border-radius: var(--radius-full);
      transition: background-color var(--transition-fast);
    }
    .top-nav .back-btn:active { background-color: var(--color-muted); }
    .top-nav .nav-title {
      flex: 1;
      text-align: center;
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      color: var(--color-foreground);
      margin-right: 36px; /* offset back button */
    }

    /* --- Content --- */
    .content { padding: var(--spacing-md); }

    /* --- Profile Card --- */
    .profile-card {
      background-color: var(--color-card);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
    }
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--color-primary-600), var(--color-primary-400));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: var(--text-xl);
      font-weight: var(--font-bold);
      flex-shrink: 0;
    }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name {
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      color: var(--color-foreground);
      margin-bottom: 2px;
    }
    .profile-phone {
      font-size: var(--text-sm);
      color: var(--color-stone-500);
      margin-bottom: var(--spacing-sm);
    }
    .profile-meta { display: flex; align-items: center; gap: var(--spacing-sm); }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      background-color: var(--color-primary-50);
      color: var(--color-primary-600);
    }
    .join-date {
      font-size: var(--text-xs);
      color: var(--color-stone-400);
    }

    /* --- Action Buttons --- */
    .action-row {
      display: flex;
      gap: var(--spacing-sm);
      margin-top: var(--spacing-md);
    }
    .btn-primary {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      border: none;
      border-radius: var(--radius-md);
      background-color: var(--color-primary-600);
      color: #ffffff;
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      cursor: pointer;
      transition: background-color var(--transition-fast);
      gap: 6px;
    }
    .btn-primary:active { background-color: var(--color-primary-700); }
    .btn-outline {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      border: 1.5px solid var(--color-primary-600);
      border-radius: var(--radius-md);
      background-color: transparent;
      color: var(--color-primary-600);
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      cursor: pointer;
      transition: background-color var(--transition-fast);
      gap: 6px;
    }
    .btn-outline:active { background-color: var(--color-primary-50); }

    /* --- Section --- */
    .section { margin-top: var(--spacing-xl); }
    .section-title {
      font-size: var(--text-base);
      font-weight: var(--font-semibold);
      color: var(--color-foreground);
      margin-bottom: var(--spacing-md);
    }

    /* --- Assessment History --- */
    .history-item {
      background-color: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-md);
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-sm);
      cursor: pointer;
      transition: box-shadow var(--transition-fast);
    }
    .history-item:last-child { margin-bottom: 0; }
    .history-item:active { box-shadow: var(--shadow-md); }
    .score-circle {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    .score-circle .score-value {
      font-size: var(--text-lg);
      font-weight: var(--font-bold);
      position: relative;
      z-index: 1;
    }
    .score-low { background-color: var(--state-warning-bg); }
    .score-low .score-value { color: var(--state-warning); }
    .score-mid { background-color: var(--state-info-bg); }
    .score-mid .score-value { color: var(--state-info); }
    .score-high { background-color: var(--state-success-bg); }
    .score-high .score-value { color: var(--state-success); }
    .history-info { flex: 1; min-width: 0; }
    .history-date {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-foreground);
      margin-bottom: 4px;
    }
    .history-status {
      font-size: var(--text-xs);
      color: var(--color-stone-400);
    }
    .type-tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      flex-shrink: 0;
    }
    .type-initial { background-color: var(--color-primary-50); color: var(--color-primary-600); }
    .type-followup { background-color: var(--state-info-bg); color: var(--state-info); }

    /* --- Body Metrics Trend --- */
    .metrics-section { margin-top: var(--spacing-xl); padding-bottom: var(--spacing-xl); }
    .metric-row {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-md);
    }
    .metric-row:last-child { margin-bottom: 0; }
    .metric-label {
      width: 72px;
      flex-shrink: 0;
      font-size: var(--text-sm);
      color: var(--color-stone-600);
      text-align: right;
    }
    .metric-bar-wrap {
      flex: 1;
      height: 12px;
      background-color: var(--color-muted);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .metric-bar {
      height: 100%;
      border-radius: var(--radius-full);
      transition: width 0.6s ease;

    .metric-value {
      width: 36px;
      flex-shrink: 0;

      color: var(--color-stone-500);

    /* bar colors */
    .bar-rose { background: linear-gradient(90deg, var(--color-primary-400), var(--color-primary-600)); }
    .bar-warning { background: linear-gradient(90deg, var(--color-primary-300), var(--state-warning)); }
    .bar-info { background: linear-gradient(90deg, #93c5fd, var(--state-info)); }
    .bar-success { background: linear-gradient(90deg, #86efac, var(--state-success)); }
    .bar-amber { background: linear-gradient(90deg, #fcd34d, #f59e0b); }
