/* ============================================================
   Posture Tracker V2 — Brand Design Tokens

:root {
  /* --- Brand Primary Scale (Rose) --- */
  --color-primary-50: #fff1f2;
  --color-primary-100: #ffe4e6;
  --color-primary-200: #fecdd3;
  --color-primary-300: #fda4af;
  --color-primary-400: #fb7185;
  --color-primary-500: #f43f5e;
  --color-primary-600: #e11d48;
  --color-primary-700: #be123c;
  --color-primary-800: #9f1239;
  --color-primary-900: #881337;

  /* --- Neutrals (Warm Stone) --- */
  --color-stone-50: #fafaf9;
  --color-stone-100: #f5f5f4;
  --color-stone-200: #e7e5e4;
  --color-stone-300: #d6d3d1;
  --color-stone-400: #a8a29e;
  --color-stone-500: #78716c;
  --color-stone-600: #57534e;
  --color-stone-700: #44403c;
  --color-stone-800: #292524;
  --color-stone-900: #1c1917;

  /* --- State Colors --- */
  --state-success: #16a34a;
  --state-success-bg: #dcfce7;
  --state-warning: #d97706;
  --state-warning-bg: #fef3c7;
  --state-error: #dc2626;
  --state-error-bg: #fee2e2;
  --state-info: #2563eb;
  --state-info-bg: #dbeafe;

  /* --- Semantic Aliases (required by apply-html-head-contract) --- */
  --color-background: #fafaf9;
  --color-foreground: #1c1917;
  --color-card: #ffffff;
  --color-card-foreground: #1c1917;
  --color-popover: #ffffff;
  --color-popover-foreground: #1c1917;
  --color-primary: #e11d48;
  --color-primary-foreground: #ffffff;
  --color-muted: #f5f5f4;
  --color-muted-foreground: #78716c;
  --color-border: #e7e5e4;
  --color-input: #e7e5e4;
  --color-ring: #e11d48;
  --color-radius-small: 4px;
  --color-radius-medium: 8px;
  --color-radius-large: 12px;

  /* --- Radius Scale --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* --- Shadows --- */
  --shadow-sm: 0 1px 2px 0 rgba(28, 25, 23, 0.03);
  --shadow: 0 1px 3px 0 rgba(28, 25, 23, 0.04), 0 1px 2px -1px rgba(28, 25, 23, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(28, 25, 23, 0.04), 0 2px 4px -2px rgba(28, 25, 23, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(28, 25, 23, 0.05), 0 4px 6px -4px rgba(28, 25, 23, 0.05);
  --shadow-float: 0 20px 25px -5px rgba(28, 25, 23, 0.1), 0 8px 10px -6px rgba(28, 25, 23, 0.08);

  /* --- Spacing --- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;
  --spacing-3xl: 64px;

  /* --- Typography --- */
  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Noto Serif SC', 'Georgia', serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;

  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  --leading-tight: 1.25;
  --leading-snug: 1.375;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 350ms ease;
}

.dark {
  --color-background: #1c1917;
  --color-foreground: #fafaf9;
  --color-card: #292524;
  --color-card-foreground: #fafaf9;

      --color-stone-500: #78716c;
      --color-stone-600: #57534e;
      --color-stone-700: #44403c;
      --color-stone-800: #292524;
      --color-stone-900: #1c1917;

      /* --- State Colors --- */
      --state-success: #16a34a;
      --state-success-bg: #dcfce7;
      --state-warning: #d97706;
      --state-warning-bg: #fef3c7;
      --state-error: #dc2626;
      --state-error-bg: #fee2e2;
      --state-info: #2563eb;
      --state-info-bg: #dbeafe;

      /* --- Semantic Aliases --- */
      --color-background: #fafaf9;
      --color-foreground: #1c1917;
      --color-card: #ffffff;
      --color-card-foreground: #1c1917;
      --color-primary: #e11d48;
      --color-primary-foreground: #ffffff;
      --color-muted: #f5f5f4;
      --color-muted-foreground: #78716c;
      --color-border: #e7e5e4;
      --color-ring: #e11d48;

      /* --- Radius --- */
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-full: 9999px;

      /* --- Shadows --- */
      --shadow-sm: 0 1px 2px 0 rgba(28, 25, 23, 0.03);
      --shadow: 0 1px 3px 0 rgba(28, 25, 23, 0.04), 0 1px 2px -1px rgba(28, 25, 23, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(28, 25, 23, 0.04), 0 2px 4px -2px rgba(28, 25, 23, 0.04);
      --shadow-lg: 0 10px 15px -3px rgba(28, 25, 23, 0.05), 0 4px 6px -4px rgba(28, 25, 23, 0.05);

      /* --- Spacing --- */
      --spacing-xs: 4px;
      --spacing-sm: 8px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-2xl: 48px;

      /* --- Typography --- */
      --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --text-xs: 0.75rem;
      --text-sm: 0.875rem;
      --text-base: 1rem;
      --text-lg: 1.125rem;
      --text-xl: 1.25rem;
      --text-2xl: 1.5rem;
      --text-3xl: 1.875rem;
      --text-4xl: 2.25rem;

      --font-normal: 400;
      --font-medium: 500;
      --font-semibold: 600;
      --font-bold: 700;
      --leading-tight: 1.25;
      --leading-snug: 1.375;
      --leading-normal: 1.5;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-sans);
      font-size: var(--text-base);
      line-height: var(--leading-normal);
      color: var(--color-foreground);
      background-color: var(--color-background);
      max-width: 375px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ========== Top Navigation ========== */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      height: 48px;
      padding: 0 var(--spacing-md);
      background: var(--color-card);
      border-bottom: 1px solid var(--color-border);
    }

    .nav-bar .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--color-foreground);
      border-radius: var(--radius-md);
      transition: background var(--transition-fast);
    }

    .nav-bar .back-btn:active {
      background: var(--color-muted);
    }

    .nav-bar .nav-title {
      flex: 1;
      text-align: center;
      font-size: var(--text-base);
      font-weight: var(--font-semibold);
      color: var(--color-foreground);
      margin-right: 32px; /* offset back button width */
    }

    /* ========== Page Content ========== */
    .page-content {
      padding: 0 var(--spacing-md) var(--spacing-2xl);
    }

    /* ========== Report Header ========== */
    .report-header {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-lg) 0;
      border-bottom: 1px solid var(--color-border);
    }

    .report-header .studio-logo {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--color-primary-400), var(--color-primary-600));
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .report-header .studio-logo svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    .report-header .studio-info {
      flex: 1;
    }

    .report-header .studio-name {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-foreground);
    }

    .report-header .report-date {
      font-size: var(--text-xs);
      color: var(--color-muted-foreground);
      margin-top: 2px;
    }

    /* ========== Student Info Card ========== */
    .info-card {
      margin-top: var(--spacing-md);
      padding: var(--spacing-md);
      background: var(--color-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
    }

    .info-card .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--spacing-sm) 0;
    }

    .info-card .info-row:not(:last-child) {
      border-bottom: 1px solid var(--color-muted);
    }

    .info-card .info-label {
      font-size: var(--text-sm);
      color: var(--color-muted-foreground);
    }

    .info-card .info-value {
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-foreground);
    }

    /* ========== Score Section ========== */
    .score-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--spacing-xl) 0;
    }

    .score-ring-container {
      position: relative;
      width: 160px;
      height: 160px;
    }

    .score-ring-container svg {
      width: 160px;
      height: 160px;
      transform: rotate(-90deg);
    }

    .score-ring-bg {
      fill: none;
      stroke: var(--color-primary-50);
      stroke-width: 10;
    }

    .score-ring-fill {
      fill: none;
      stroke: var(--color-primary-600);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 408;
      stroke-dashoffset: 61.2;
      transition: stroke-dashoffset 1s ease;
    }

    .score-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .score-number {
      font-size: var(--text-4xl);
      font-weight: var(--font-bold);
      color: var(--color-primary-600);
      line-height: 1;
    }

    .score-label {
      font-size: var(--text-xs);
      color: var(--color-muted-foreground);
      margin-top: var(--spacing-xs);
    }

    /* ========== Radar Chart ========== */
    .radar-section {
      margin-top: var(--spacing-sm);
      text-align: center;
    }

    .radar-section .section-title {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-foreground);
      margin-bottom: var(--spacing-md);
    }

    .radar-chart-container {
      display: flex;
      justify-content: center;
      padding: var(--spacing-md);
      background: var(--color-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
    }

    .radar-chart-container svg {
      width: 280px;
      height: 260px;
    }

    /* ========== Metrics Table ========== */
    .metrics-section {
      margin-top: var(--spacing-xl);
    }

    .metrics-section .section-title {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-foreground);
      margin-bottom: var(--spacing-md);
    }

    .metrics-table {
      background: var(--color-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      overflow: hidden;
    }

    .metrics-table .metric-row {
      display: flex;
      align-items: center;
      padding: var(--spacing-sm) var(--spacing-md);
    }

    .metrics-table .metric-row:not(:last-child) {
      border-bottom: 1px solid var(--color-muted);
    }

    .metric-row .metric-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-right: var(--spacing-sm);
    }

    .metric-row .metric-icon.success {
      background: var(--state-success-bg);
      color: var(--state-success);
    }

    .metric-row .metric-icon.warning {
      background: var(--state-warning-bg);
      color: var(--state-warning);
    }

    .metric-row .metric-icon svg {
      width: 16px;
      height: 16px;
    }

    .metric-row .metric-name {
      flex: 1;
      font-size: var(--text-sm);
      color: var(--color-foreground);
    }

    .metric-row .metric-value {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-foreground);
      margin-right: var(--spacing-sm);
    }

    .metric-row .metric-status {
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }

    .metric-row .metric-status.normal {
      background: var(--state-success-bg);
      color: var(--state-success);
    }

    .metric-row .metric-status.mild {
      background: var(--state-warning-bg);
      color: var(--state-warning);
    }

    /* ========== Suggestions Section ========== */
    .suggestions-section {
      margin-top: var(--spacing-xl);
    }

    .suggestions-section .section-title {
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      color: var(--color-foreground);
      margin-bottom: var(--spacing-md);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }

    .suggestions-section .section-title svg {
      width: 18px;
      height: 18px;
      fill: var(--color-primary-600);
    }

    .suggestion-list {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-sm);
    }

    .suggestion-item {
      display: flex;
      gap: var(--spacing-sm);
      padding: var(--spacing-md);
      background: var(--color-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
    }

    .suggestion-item .suggestion-num {
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      background: var(--color-primary-50);
      color: var(--color-primary-600);
      font-size: var(--text-xs);
      font-weight: var(--font-bold);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .suggestion-item .suggestion-text {
      font-size: var(--text-sm);
      color: var(--color-foreground);
      line-height: var(--leading-relaxed);
    }

    /* ========== Footer ========== */
    .report-footer {
      margin-top: var(--spacing-2xl);
      padding: var(--spacing-xl) 0;
      text-align: center;
      border-top: 1px solid var(--color-border);
    }

    .qr-placeholder {
      width: 120px;
      height: 120px;
      margin: 0 auto var(--spacing-md);
      background: var(--color-muted);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--color-stone-300);
    }

    .qr-placeholder svg {
      width: 48px;
      height: 48px;
      color: var(--color-stone-400);
    }

    .qr-label {
      font-size: var(--text-sm);
      color: var(--color-muted-foreground);
    }

    .qr-hint {
      font-size: var(--text-xs);
      color: var(--color-stone-400);
      margin-top: var(--spacing-xs);
    }
  </style>
</body>
</html>
