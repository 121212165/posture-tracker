/* ============================================================
   Posture Tracker V2 — Brand Design Tokens
   Primary: Rose (#e11d48 family) — Pilates professional tone
   Neutrals: Warm stone grays
   ============================================================ */

:root {
  /* --- Brand Primary Scale (Rose) --- */
  --color-primary-50: #fff1f2;
  --color-primary-100: #ffe4e6;
  --color-primary-200: #fecdd3;
  --color-primary-300: #fda4af;
  --color-primary-400: #fb7185;
  --color-primary-500: #f43f5e;
  --color-primary-600: #e11d48;
  --color-primary-700: #be123c;
  --color-primary-800: #9f1239;
  --color-primary-900: #881337;

  /* --- Neutrals (Warm Stone) --- */
  --color-stone-50: #fafaf9;
  --color-stone-100: #f5f5f4;
  --color-stone-200: #e7e5e4;
  --color-stone-300: #d6d3d1;
  --color-stone-400: #a8a29e;
  --color-stone-500: #78716c;
  --color-stone-600: #57534e;
  --color-stone-700: #44403c;
  --color-stone-800: #292524;
  --color-stone-900: #1c1917;

  /* --- State Colors --- */
  --state-success: #16a34a;
  --state-success-bg: #dcfce7;
  --state-warning: #d97706;
  --state-warning-bg: #fef3c7;
  --state-error: #dc2626;
  --state-error-bg: #fee2e2;
  --state-info: #2563eb;
  --state-info-bg: #dbeafe;

  /* --- Semantic Aliases (required by apply-html-head-contract) --- */
  --color-background: #fafaf9;
  --color-foreground: #1c1917;
  --color-card: #ffffff;
  --color-card-foreground: #1c1917;
  --color-popover: #ffffff;
  --color-popover-foreground: #1c1917;
  --color-primary: #e11d48;
  --color-primary-foreground: #ffffff;
  --color-muted: #f5f5f4;
  --color-muted-foreground: #78716c;
  --color-border: #e7e5e4;
  --color-input: #e7e5e4;
  --color-ring: #e11d48;
  --color-radius-small: 4px;
  --color-radius-medium: 8px;
  --color-radius-large: 12px;

  /* --- Radius Scale --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* --- Shadows --- */
  --shadow-sm: 0 1px 2px 0 rgba(28, 25, 23, 0.03);
  --shadow: 0 1px 3px 0 rgba(28, 25, 23, 0.04), 0 1px 2px -1px rgba(28, 25, 23, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(28, 25, 23, 0.04), 0 2px 4px -2px rgba(28, 25, 23, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(28, 25, 23, 0.05), 0 4px 6px -4px rgba(28, 25, 23, 0.05);
  --shadow-float: 0 20px 25px -5px rgba(28, 25, 23, 0.1), 0 8px 10px -6px rgba(28, 25, 23, 0.08);

  /* --- Spacing --- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;
  --spacing-3xl: 64px;

  /* --- Typography --- */
  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Noto Serif SC', 'Georgia', serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;

  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  --leading-tight: 1.25;
  --leading-snug: 1.375;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 350ms ease;
}

.dark {
  --color-background: #1c1917;
  --color-foreground: #fafaf9;
  --color-card: #292524;
  --color-card-foreground: #fafaf9;
  --color-popover: #292524;
  --color-popover-foreground: #fafaf9;
  --color-primary: #fb7185;

  --color-muted-foreground: #a8a29e;
  --color-border: #44403c;
  --color-input: #44403c;
  --color-ring: #fb7185;
}

.leading-normal { line-height: var(--leading-normal); }
.leading-relaxed { line-height: var(--leading-relaxed); }

    <style>
    /* --- Reset & Base --- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans, 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
      background-color: #fafaf9;
      color: #1c1917;
      font-size: var(--text-base, 1rem);
      line-height: var(--leading-normal, 1.5);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* --- Top Navigation --- */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      background-color: #ffffff;
      border-bottom: 1px solid #e7e5e4;
      box-shadow: 0 1px 2px 0 rgba(28, 25, 23, 0.03);
    }

    .top-nav__back {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      color: #1c1917;
      -webkit-tap-highlight-color: transparent;
    }

    .top-nav__title {
      font-size: var(--text-base, 1rem);
      font-weight: var(--font-semibold, 600);
      color: #1c1917;
      line-height: var(--leading-tight, 1.25);
    }

    /* --- Page Content --- */
    .page-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 40px;
    }

    /* --- Card --- */
    .card {
      background-color: #ffffff;
      border-radius: var(--color-radius-large, 12px);
      padding: 20px;
      box-shadow: 0 1px 3px 0 rgba(28, 25, 23, 0.04), 0 1px 2px -1px rgba(28, 25, 23, 0.04);
    }

    .card__title {
      font-size: var(--text-sm, 0.875rem);
      font-weight: var(--font-semibold, 600);
      color: #1c1917;
      margin-bottom: 16px;
      letter-spacing: 0.02em;
    }

    /* --- Picker Field --- */
    .picker-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 48px;
      padding: 0 16px;
      border: 1px solid #e7e5e4;
      border-radius: var(--color-radius-medium, 8px);
      background-color: #ffffff;
      color: #a8a29e;
      font-size: var(--text-sm, 0.875rem);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 150ms ease;
    }

    .picker-field:active {
      border-color: #e11d48;
    }

    .picker-field__chevron {
      color: #a8a29e;
      flex-shrink: 0;
      margin-left: 8px;
    }

    /* --- Radio Group --- */
    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .radio-item {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .radio-item input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #d6d3d1;
      border-radius: 50%;
      flex-shrink: 0;
      position: relative;
      cursor: pointer;
      transition: border-color 150ms ease;
    }

    .radio-item input[type="radio"]:checked {
      border-color: #e11d48;
      background-color: #e11d48;
    }

    .radio-item input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ffffff;
    }

    .radio-item__label {
      font-size: var(--text-sm, 0.875rem);
      font-weight: var(--font-medium, 500);
      color: #1c1917;
    }

    /* --- Photo Upload --- */
    .photo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .photo-upload {
      position: relative;
      aspect-ratio: 3 / 4;
      border: 2px dashed #d6d3d1;
      border-radius: var(--color-radius-medium, 8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #fafaf9;
      cursor: pointer;
      transition: border-color 150ms ease, background-color 150ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .photo-upload:active {
      border-color: #fb7185;
      background-color: #fff1f2;
    }

    .photo-upload__icon {
      color: #a8a29e;
    }

    .photo-upload__label {
      font-size: var(--text-xs, 0.75rem);
      font-weight: var(--font-medium, 500);
      color: #78716c;
    }

    .photo-tip {
      margin-top: 16px;
      font-size: var(--text-xs, 0.75rem);
      color: #a8a29e;
      line-height: var(--leading-relaxed, 1.625);
    }

    /* --- Submit Button --- */
    .submit-btn {
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: var(--color-radius-medium, 8px);
      background: linear-gradient(135deg, #e11d48 0%, #f43f5e 50%, #fb7185 100%);
      color: #ffffff;
      font-size: var(--text-base, 1rem);
      font-weight: var(--font-semibold, 600);
      cursor: pointer;
      box-shadow: 0 4px 14px -2px rgba(225, 29, 72, 0.35);
      transition: opacity 150ms ease, transform 150ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .submit-btn:active {
      opacity: 0.9;
      transform: scale(0.98);
    }

    .submit-btn__icon {
      flex-shrink: 0;
    }
  </style>
</body>
