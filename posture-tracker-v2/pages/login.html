<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 体态评估助手</title>
    <style id="theme-vars">
/* ============================================================
   Posture Tracker V2 — Brand Design Tokens
   Primary: Rose (#e11d48 family) — Pilates professional tone
   Neutrals: Warm stone grays
   ============================================================ */

:root {
  /* --- Brand Primary Scale (Rose) --- */
  --color-primary-50: #fff1f2;
  --color-primary-100: #ffe4e6;
  --color-primary-200: #fecdd3;
  --color-primary-300: #fda4af;
  --color-primary-400: #fb7185;
  --color-primary-500: #f43f5e;
  --color-primary-600: #e11d48;
  --color-primary-700: #be123c;
  --color-primary-800: #9f1239;
  --color-primary-900: #881337;

  /* --- Neutrals (Warm Stone) --- */
  --color-stone-50: #fafaf9;
  --color-stone-100: #f5f5f4;
  --color-stone-200: #e7e5e4;
  --color-stone-300: #d6d3d1;
  --color-stone-400: #a8a29e;
  --color-stone-500: #78716c;
  --color-stone-600: #57534e;
  --color-stone-700: #44403c;
  --color-stone-800: #292524;
  --color-stone-900: #1c1917;

  /* --- State Colors --- */
  --state-success: #16a34a;
  --state-success-bg: #dcfce7;
  --state-warning: #d97706;
  --state-warning-bg: #fef3c7;
  --state-error: #dc2626;
  --state-error-bg: #fee2e2;
  --state-info: #2563eb;
  --state-info-bg: #dbeafe;

  /* --- Semantic Aliases (required by apply-html-head-contract) --- */
  --color-background: #fafaf9;
  --color-foreground: #1c1917;
  --color-card: #ffffff;
  --color-card-foreground: #1c1917;
  --color-popover: #ffffff;
  --color-popover-foreground: #1c1917;
  --color-primary: #e11d48;
  --color-primary-foreground: #ffffff;
  --color-muted: #f5f5f4;
  --color-muted-foreground: #78716c;
  --color-border: #e7e5e4;
  --color-input: #e7e5e4;
  --color-ring: #e11d48;
  --color-radius-small: 4px;
  --color-radius-medium: 8px;
  --color-radius-large: 12px;

  /* --- Radius Scale --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* --- Shadows --- */
  --shadow-sm: 0 1px 2px 0 rgba(28, 25, 23, 0.03);
  --shadow: 0 1px 3px 0 rgba(28, 25, 23, 0.04), 0 1px 2px -1px rgba(28, 25, 23, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(28, 25, 23, 0.04), 0 2px 4px -2px rgba(28, 25, 23, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(28, 25, 23, 0.05), 0 4px 6px -4px rgba(28, 25, 23, 0.05);
  --shadow-float: 0 20px 25px -5px rgba(28, 25, 23, 0.1), 0 8px 10px -6px rgba(28, 25, 23, 0.08);

  /* --- Spacing --- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;
  --spacing-3xl: 64px;

  /* --- Typography --- */
  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Noto Serif SC', 'Georgia', serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;

  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  --leading-tight: 1.25;
  --leading-snug: 1.375;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 350ms ease;
}

.dark {
  --color-background: #1c1917;
  --color-foreground: #fafaf9;
  --color-card: #292524;
  --color-card-foreground: #fafaf9;
  --color-popover: #292524;
  --color-popover-foreground: #fafaf9;
  --color-primary: #fb7185;
  --color-primary-foreground: #1c1917;
  --color-muted: #44403c;
  --color-muted-foreground: #a8a29e;
  --color-border: #44403c;
  --color-input: #44403c;
  --color-ring: #fb7185;
}

.font-sans { font-family: var(--font-sans); }
.font-serif { font-family: var(--font-serif); }
.font-mono { font-family: var(--font-mono); }

.text-xs { font-size: var(--text-xs); line-height: var(--leading-normal); }
.text-sm { font-size: var(--text-sm); line-height: var(--leading-normal); }
.text-base { font-size: var(--text-base); line-height: var(--leading-normal); }
.text-lg { font-size: var(--text-lg); line-height: var(--leading-snug); }
.text-xl { font-size: var(--text-xl); line-height: var(--leading-snug); }
.text-2xl { font-size: var(--text-2xl); line-height: var(--leading-tight); }
.text-3xl { font-size: var(--text-3xl); line-height: var(--leading-tight); }
.text-4xl { font-size: var(--text-4xl); line-height: var(--leading-tight); }

.font-normal { font-weight: var(--font-normal); }
.font-medium { font-weight: var(--font-medium); }
.font-semibold { font-weight: var(--font-semibold); }
.font-bold { font-weight: var(--font-bold); }

.leading-tight { line-height: var(--leading-tight); }
.leading-snug { line-height: var(--leading-snug); }
.leading-normal { line-height: var(--leading-normal); }
.leading-relaxed { line-height: var(--leading-relaxed); }

    </style>

  }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        display: inline-flex;
        align-items: center;

      /* ===== Login Page Styles ===== */
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-sans);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, var(--color-primary-50) 0%, var(--color-stone-50) 100%);
        padding: var(--spacing-xl);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .login-container {
        width: 100%;
        max-width: 375px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Logo Area */
      .logo-wrapper {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        padding: 3px;
        background: linear-gradient(135deg, var(--color-primary-400), var(--color-primary-600));
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: var(--spacing-xl);
        box-shadow: 0 8px 24px rgba(225, 29, 72, 0.12);
      }

      .logo-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: var(--color-card);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .logo-inner svg {
        width: 48px;
        height: 48px;
        color: var(--color-primary-600);
      }

      /* App Name */
      .app-name {
        font-size: var(--text-2xl);
        font-weight: var(--font-bold);
        color: var(--color-stone-900);
        line-height: var(--leading-tight);
        margin-bottom: var(--spacing-sm);
        letter-spacing: -0.01em;
      }

      /* Tagline */
      .tagline {
        font-size: var(--text-sm);
        color: var(--color-stone-500);
        line-height: var(--leading-relaxed);
        margin-bottom: var(--spacing-3xl);
        text-align: center;
      }

      /* WeChat Login Button */
      .wechat-btn {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--spacing-sm);
        padding: 14px var(--spacing-lg);
        background: var(--color-primary-600);
        color: var(--color-primary-foreground);
        border: none;
        border-radius: var(--radius-full);
        font-family: var(--font-sans);
        font-size: var(--text-base);
        font-weight: var(--font-medium);
        cursor: pointer;
        transition: background-color var(--transition-base), box-shadow var(--transition-base);
        box-shadow: 0 4px 12px rgba(225, 29, 72, 0.15);
        -webkit-tap-highlight-color: transparent;
      }

      .wechat-btn:active {
        background: var(--color-primary-700);
        box-shadow: 0 2px 6px rgba(225, 29, 72, 0.2);
        transform: scale(0.98);
        transition-duration: var(--transition-fast);
      }

      .wechat-icon {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
      }

      /* Agreement Text */
      .agreement {
        margin-top: var(--spacing-2xl);
        font-size: var(--text-xs);
        color: var(--color-stone-400);
        text-align: center;
        line-height: var(--leading-relaxed);
      }

      .agreement a {
        color: var(--color-primary-600);
        text-decoration: none;
        font-weight: var(--font-medium);
      }

      .agreement a:active {
        color: var(--color-primary-700);
      }
    </style>
</head>

        <!-- Logo with Pilates silhouette -->

        <!-- Tagline -->
        <p class="tagline">专业普拉提工作室体态管理系统</p>

        <!-- Agreement Text -->
        <p class="agreement">

    </div>
