<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评估详情 - 体态评估助手</title>
    <style id="theme-vars">
/* ============================================================
   Posture Tracker V2 — Brand Design Tokens
   Primary: Rose (#e11d48 family) — Pilates professional tone
   Neutrals: Warm stone grays
   ============================================================ */

:root {
  /* --- Brand Primary Scale (Rose) --- */
  --color-primary-50: #fff1f2;
  --color-primary-100: #ffe4e6;
  --color-primary-200: #fecdd3;
  --color-primary-300: #fda4af;
  --color-primary-400: #fb7185;
  --color-primary-500: #f43f5e;
  --color-primary-600: #e11d48;
  --color-primary-700: #be123c;
  --color-primary-800: #9f1239;
  --color-primary-900: #881337;

  /* --- Neutrals (Warm Stone) --- */
  --color-stone-50: #fafaf9;
  --color-stone-100: #f5f5f4;
  --color-stone-200: #e7e5e4;
  --color-stone-300: #d6d3d1;
  --color-stone-400: #a8a29e;
  --color-stone-500: #78716c;
  --color-stone-600: #57534e;
  --color-stone-700: #44403c;
  --color-stone-800: #292524;
  --color-stone-900: #1c1917;

  /* --- State Colors --- */
  --state-success: #16a34a;
  --state-success-bg: #dcfce7;
  --state-warning: #d97706;
  --state-warning-bg: #fef3c7;
  --state-error: #dc2626;
  --state-error-bg: #fee2e2;
  --state-info: #2563eb;
  --state-info-bg: #dbeafe;

  /* --- Semantic Aliases (required by apply-html-head-contract) --- */
  --color-background: #fafaf9;
  --color-foreground: #1c1917;
  --color-card: #ffffff;
  --color-card-foreground: #1c1917;
  --color-popover: #ffffff;
  --color-popover-foreground: #1c1917;
  --color-primary: #e11d48;
  --color-primary-foreground: #ffffff;
  --color-muted: #f5f5f4;
  --color-muted-foreground: #78716c;
  --color-border: #e7e5e4;
  --color-input: #e7e5e4;
  --color-ring: #e11d48;
  --color-radius-small: 4px;
  --color-radius-medium: 8px;
  --color-radius-large: 12px;

  /* --- Radius Scale --- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;

  /* --- Shadows --- */
  --shadow-sm: 0 1px 2px 0 rgba(28, 25, 23, 0.03);
  --shadow: 0 1px 3px 0 rgba(28, 25, 23, 0.04), 0 1px 2px -1px rgba(28, 25, 23, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(28, 25, 23, 0.04), 0 2px 4px -2px rgba(28, 25, 23, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(28, 25, 23, 0.05), 0 4px 6px -4px rgba(28, 25, 23, 0.05);
  --shadow-float: 0 20px 25px -5px rgba(28, 25, 23, 0.1), 0 8px 10px -6px rgba(28, 25, 23, 0.08);

  /* --- Spacing --- */
  --spacing-xs: 4px;
  --spacing-sm: 8px;
  --spacing-md: 16px;
  --spacing-lg: 24px;
  --spacing-xl: 32px;
  --spacing-2xl: 48px;
  --spacing-3xl: 64px;

  /* --- Typography --- */
  --font-sans: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Noto Serif SC', 'Georgia', serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.125rem;
  --text-xl: 1.25rem;
  --text-2xl: 1.5rem;
  --text-3xl: 1.875rem;
  --text-4xl: 2.25rem;

  --font-normal: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;

  --leading-tight: 1.25;
  --leading-snug: 1.375;
  --leading-normal: 1.5;
  --leading-relaxed: 1.625;

  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 350ms ease;
}

.dark {
  --color-background: #1c1917;
  --color-foreground: #fafaf9;
  --color-card: #292524;
  --color-card-foreground: #fafaf9;
  --color-popover: #292524;
  --color-popover-foreground: #fafaf9;
  --color-primary: #fb7185;
  --color-primary-foreground: #1c1917;
  --color-muted: #44403c;
  --color-muted-foreground: #a8a29e;
  --color-border: #44403c;
  --color-input: #44403c;
  --color-ring: #fb7185;
}

.font-sans { font-family: var(--font-sans); }
.font-serif { font-family: var(--font-serif); }
.font-mono { font-family: var(--font-mono); }

.text-xs { font-size: var(--text-xs); line-height: var(--leading-normal); }
.text-sm { font-size: var(--text-sm); line-height: var(--leading-normal); }
.text-base { font-size: var(--text-base); line-height: var(--leading-normal); }
.text-lg { font-size: var(--text-lg); line-height: var(--leading-snug); }
.text-xl { font-size: var(--text-xl); line-height: var(--leading-snug); }
.text-2xl { font-size: var(--text-2xl); line-height: var(--leading-tight); }
.text-3xl { font-size: var(--text-3xl); line-height: var(--leading-tight); }
.text-4xl { font-size: var(--text-4xl); line-height: var(--leading-tight); }

.font-normal { font-weight: var(--font-normal); }
.font-medium { font-weight: var(--font-medium); }
.font-semibold { font-weight: var(--font-semibold); }
.font-bold { font-weight: var(--font-bold); }

.leading-tight { line-height: var(--leading-tight); }
.leading-snug { line-height: var(--leading-snug); }
.leading-normal { line-height: var(--leading-normal); }
.leading-relaxed { line-height: var(--leading-relaxed); }

    </style>

    <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-sans); background-color: var(--color-background); color: var(--color-foreground); min-height: 100vh; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    /* Top Navigation */
    .top-nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: center; height: 48px; padding: 0 var(--spacing-md); background-color: var(--color-card); border-bottom: 1px solid var(--color-border); }
    .top-nav__title { font-size: var(--text-lg); font-weight: var(--font-semibold); color: var(--color-foreground); }
    .top-nav__back { position: absolute; left: var(--spacing-md); display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: none; background: none; cursor: pointer; color: var(--color-foreground); -webkit-tap-highlight-color: transparent; }
    .top-nav__back svg { width: 22px; height: 22px; stroke: currentColor; }

    /* Page Content */
    .page-content { padding: var(--spacing-md); display: flex; flex-direction: column; gap: var(--spacing-md); }

    /* Status Banner */
    .status-banner { border-radius: var(--radius-lg); padding: var(--spacing-lg); display: flex; align-items: center; gap: var(--spacing-md); background: linear-gradient(135deg, #dcfce7, #bbf7d0); }
    .status-banner__icon { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; background: var(--state-success); display: flex; align-items: center; justify-content: center; }
    .status-banner__icon svg { width: 24px; height: 24px; stroke: #ffffff; }
    .status-banner__text { display: flex; flex-direction: column; gap: 2px; }
    .status-banner__label { font-size: var(--text-lg); font-weight: var(--font-semibold); color: #166534; }
    .status-banner__date { font-size: var(--text-sm); color: #15803d; }

    /* Card */
    .card { background-color: var(--color-card); border-radius: var(--radius-lg); padding: var(--spacing-lg); box-shadow: var(--shadow); }

    /* Info Card */
    .info-card__list { display: flex; flex-direction: column; }
    .info-card__item { display: flex; justify-content: space-between; align-items: center; padding: var(--spacing-sm) 0; border-bottom: 1px solid var(--color-border); }
    .info-card__item:last-child { border-bottom: none; padding-bottom: 0; }
    .info-card__item:first-child { padding-top: 0; }
    .info-card__label { font-size: var(--text-sm); color: var(--color-muted-foreground); flex-shrink: 0; }
    .info-card__value { font-size: var(--text-sm); font-weight: var(--font-medium); color: var(--color-foreground); text-align: right; }

    /* Overall Score */
    .score-section { display: flex; flex-direction: column; align-items: center; padding: var(--spacing-xl) var(--spacing-lg); }
    .score-ring { position: relative; width: 160px; height: 160px; }
    .score-ring svg { width: 160px; height: 160px; transform: rotate(-90deg); }
    .score-ring__bg { fill: none; stroke: var(--color-primary-50); stroke-width: 10; }
    .score-ring__fill { fill: none; stroke: var(--color-primary-600); stroke-width: 10; stroke-linecap: round; stroke-dasharray: 408.4; stroke-dashoffset: 61.26; transition: stroke-dashoffset 1s ease; }
    .score-ring__center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .score-ring__number { font-size: 48px; font-weight: var(--font-bold); color: var(--color-primary-600); line-height: 1; font-variant-numeric: tabular-nums; }
    .score-ring__unit { font-size: var(--text-sm); color: var(--color-muted-foreground); margin-top: 2px; }
    .score-label { margin-top: var(--spacing-md); font-size: var(--text-sm); color: var(--color-muted-foreground); }

    /* Metrics Card */
    .metrics-card__title { font-size: var(--text-base); font-weight: var(--font-semibold); color: var(--color-foreground); margin-bottom: var(--spacing-md); }
    .metrics-list { display: flex; flex-direction: column; gap: var(--spacing-md); }
    .metric-item { display: flex; flex-direction: column; gap: 6px; }
    .metric-item__header { display: flex; justify-content: space-between; align-items: center; }
    .metric-item__name { font-size: var(--text-sm); color: var(--color-foreground); font-weight: var(--font-medium); }
    .metric-item__value { font-size: var(--text-sm); font-weight: var(--font-semibold); font-variant-numeric: tabular-nums; }
    .metric-item__value--good { color: var(--state-success); }
    .metric-item__value--warning { color: var(--state-warning); }
    .metric-bar { width: 100%; height: 6px; background-color: var(--color-muted); border-radius: var(--radius-full); overflow: hidden; }
    .metric-bar__fill { height: 100%; border-radius: var(--radius-full); transition: width 0.8s ease; }
    .metric-bar__fill--good { background-color: var(--state-success); }
    .metric-bar__fill--warning { background-color: var(--state-warning); }

    /* Action Button */
    .action-button { display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; border: none; border-radius: var(--radius-md); background-color: var(--color-primary-600); color: #ffffff; font-family: var(--font-sans); font-size: var(--text-base); font-weight: var(--font-semibold); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background-color var(--transition-fast); margin-top: var(--spacing-sm); }
    .action-button:active { background-color: var(--color-primary-700); }

    /* Bottom safe area spacer */
    .bottom-spacer { height: env(safe-area-inset-bottom, 0px); min-height: var(--spacing-lg); }
    </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="top-nav">
    <button class="top-nav__back" data-dom-id="back-index" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>
    <span class="top-nav__title">评估详情</span>
  </nav>

  <!-- Page Content -->
  <main class="page-content">

    <!-- 1. Status Banner -->
    <div class="status-banner">
      <div class="status-banner__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="status-banner__text">
        <span class="status-banner__label">评估完成</span>
        <span class="status-banner__date">2024年6月15日</span>
      </div>
    </div>

    <!-- 2. Basic Info Card -->
    <div class="card">
      <div class="info-card__list">
        <div class="info-card__item">
          <span class="info-card__label">学员</span>
          <span class="info-card__value">张美琪</span>
        </div>
        <div class="info-card__item">
          <span class="info-card__label">类型</span>
          <span class="info-card__value">初始评估</span>
        </div>
        <div class="info-card__item">
          <span class="info-card__label">教练</span>
          <span class="info-card__value">陈教练</span>
        </div>
        <div class="info-card__item">
          <span class="info-card__label">日期</span>
          <span class="info-card__value">2024-06-15</span>
        </div>
      </div>
    </div>

    <!-- 3. Overall Score -->
    <div class="card score-section">
      <div class="score-ring">
        <svg viewBox="0 0 160 160">
          <circle class="score-ring__bg" cx="80" cy="80" r="65"></circle>
          <circle class="score-ring__fill" cx="80" cy="80" r="65"></circle>
        </svg>
        <div class="score-ring__center">
          <div class="score-ring__number">85</div>
          <div class="score-ring__unit">分</div>
        </div>
      </div>
      <div class="score-label">综合体态评分</div>
    </div>

    <!-- 4. Metrics Detail Card -->
    <div class="card">
      <div class="metrics-card__title">评估指标明细</div>
      <div class="metrics-list">

        <!-- 圆肩程度 -->
        <div class="metric-item">
          <div class="metric-item__header">
            <span class="metric-item__name">圆肩程度</span>
            <span class="metric-item__value metric-item__value--good">12°</span>
          </div>
          <div class="metric-bar">
            <div class="metric-bar__fill metric-bar__fill--good" style="width: 24%;"></div>
          </div>
        </div>

        <!-- 头前伸 -->
        <div class="metric-item">
          <div class="metric-item__header">
            <span class="metric-item__name">头前伸</span>
            <span class="metric-item__value metric-item__value--good">6mm</span>
          </div>
          <div class="metric-bar">
            <div class="metric-bar__fill metric-bar__fill--good" style="width: 15%;"></div>
          </div>
        </div>

        <!-- 骨盆倾斜 -->
        <div class="metric-item">
          <div class="metric-item__header">
            <span class="metric-item__name">骨盆倾斜</span>
            <span class="metric-item__value metric-item__value--good">8°</span>
          </div>
          <div class="metric-bar">
            <div class="metric-bar__fill metric-bar__fill--good" style="width: 16%;"></div>
          </div>
        </div>

        <!-- 高低肩 -->
        <div class="metric-item">
          <div class="metric-item__header">
            <span class="metric-item__name">高低肩</span>
            <span class="metric-item__value metric-item__value--good">1.5cm</span>
          </div>
          <div class="metric-bar">
            <div class="metric-bar__fill metric-bar__fill--good" style="width: 20%;"></div>
          </div>
        </div>

        <!-- 膝盖过伸 -->
        <div class="metric-item">
          <div class="metric-item__header">
            <span class="metric-item__name">膝盖过伸</span>
            <span class="metric-item__value metric-item__value--warning">178°</span>
          </div>
          <div class="metric-bar">
            <div class="metric-bar__fill metric-bar__fill--warning" style="width: 60%;"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- 5. Action Button -->
    <button class="action-button" type="button">生成报告</button>

    <div class="bottom-spacer"></div>
  </main>
</body>
</html>
